# Netlify configuration for the static CivicLens frontend.
# The FastAPI backend is deployed separately (see render.yaml).

[build]
  command = "sh ./netlify-build.sh"
  publish = "."

# Set CIVICLENS_API_BASE in the Netlify Dashboard to the public URL of the
# deployed FastAPI service, for example https://nagarsetu-api.onrender.com.
[build.environment]
  CIVICLENS_API_BASE = "https://nagarsetu-l2r8.onrender.com"

# Development settings
[dev]
  # Run FastAPI backend locally
  command = "uvicorn app.main:app --app-dir backend --reload --host 127.0.0.1 --port 8000"
  port = 8000
  # Also serve frontend
  framework = "#custom"

# Cache headers for static assets
[[headers]]
  for = "/*.{js,css,png,jpg,jpeg,gif,svg,webp,woff,woff2}"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Cache control for HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Optional: Custom error page
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 404
