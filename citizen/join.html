<!DOCTYPE html>

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col justify-center items-center p-4">
<!-- Transactional Screen - No Global Nav Shell -->
<main class="w-full max-w-md bg-surface-container-low rounded-xl shadow-[0_4px_20px_rgba(69,4,50,0.08)] p-6 md:p-8 flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Subtle decorative element to enhance editorial feel without cluttering -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-fixed rounded-full blur-3xl opacity-50 pointer-events-none"></div>
<header class="text-center flex flex-col gap-unit">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Join NagarSetu</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Engage with your community.</p>
</header>
<div class="flex flex-col gap-stack-md">
<button id="demo-citizen-btn" class="w-full bg-primary text-on-primary border border-primary rounded-full py-3 px-4 flex items-center justify-center gap-3 hover:bg-primary/90 transition-colors duration-200 active:scale-[0.98] shadow-md" type="button">
<span class="material-symbols-outlined">account_circle</span>
<span class="font-label-md text-label-md">Continue as Demo Citizen</span>
</button>
<div class="flex items-center gap-4 py-2">
<div class="flex-grow h-px bg-outline-variant/50"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">or</span>
<div class="flex-grow h-px bg-outline-variant/50"></div>
</div>
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">call</span>
<input class="w-full bg-surface border-2 border-primary/20 rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-0 transition-colors placeholder:text-outline-variant" id="phone" placeholder="(555) 000-0000" type="tel"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary rounded-full py-3 px-4 font-label-md text-label-md hover:bg-primary/90 transition-colors duration-200 active:scale-[0.98] shadow-md shadow-primary/20 flex items-center justify-center gap-2" onclick="location.href='otp.html'" type="button">
                    Send OTP <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
</div>
<footer class="text-center mt-auto pt-4">
<div class="inline-flex items-center gap-2 bg-surface-variant/50 px-4 py-2 rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-secondary text-sm">lock</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">We only ask for what we need.</p>
</div>
</footer>
</main>
<script src="../assets/js/api.js"></script>
</body></html>
